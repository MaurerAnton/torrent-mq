apiVersion: v1
kind: Namespace
metadata:
  name: torrent-mq
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: torrent-mq
  namespace: torrent-mq
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: torrent-mq
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: torrent-mq
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: torrent-mq
subjects:
  - kind: ServiceAccount
    name: torrent-mq
    namespace: torrent-mq
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: torrent-mq-config
  namespace: torrent-mq
data:
  config.yaml: |
    broker:
      id: ${BROKER_ID}

    listeners:
      plain:
        host: 0.0.0.0
        port: 9092
      tls:
        host: 0.0.0.0
        port: 9093

    admin:
      enabled: true
      port: 9644

    metrics:
      enabled: true
      port: 9090

    storage:
      log:
        dir: /data/torrent
        segment:
          bytes: 1073741824
      retention:
        ms: 604800000

    network:
      num_io_threads: 4
      num_worker_threads: 8
      max_connections: 65536
      socket:
        send_buffer:
          bytes: 1048576
        recv_buffer:
          bytes: 1048576

    topic:
      default:
        replication_factor: 3
        partitions: 1
      auto_create: true

    raft:
      heartbeat_interval_ms: 150
      election_timeout_min_ms: 150
      election_timeout_max_ms: 300
      pre_vote: true
      leader_lease: true

    cluster:
      id: k8s-cluster
      seed_servers: ${SEED_SERVERS}

    security:
      sasl:
        enabled: ${SASL_ENABLED}
      tls:
        enabled: ${TLS_ENABLED}
        certificate_path: /etc/torrent/certs/tls.crt
        key_path: /etc/torrent/certs/tls.key
        ca_path: /etc/torrent/certs/ca.crt
---
apiVersion: v1
kind: Secret
metadata:
  name: torrent-mq-tls
  namespace: torrent-mq
type: kubernetes.io/tls
data:
  tls.crt: ${TLS_CERT_BASE64}
  tls.key: ${TLS_KEY_BASE64}
---
apiVersion: v1
kind: Secret
metadata:
  name: torrent-mq-ca
  namespace: torrent-mq
data:
  ca.crt: ${CA_CERT_BASE64}
---
apiVersion: v1
kind: Service
metadata:
  name: torrent-mq
  namespace: torrent-mq
  labels:
    app: torrent-mq
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  clusterIP: None
  selector:
    app: torrent-mq
  ports:
    - name: plain
      port: 9092
      targetPort: 9092
    - name: tls
      port: 9093
      targetPort: 9093
    - name: admin
      port: 9644
      targetPort: 9644
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: torrent-mq-external
  namespace: torrent-mq
  labels:
    app: torrent-mq
spec:
  type: LoadBalancer
  selector:
    app: torrent-mq
  ports:
    - name: plain
      port: 9092
      targetPort: 9092
    - name: tls
      port: 9093
      targetPort: 9093
    - name: admin
      port: 9644
      targetPort: 9644
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: torrent-mq
  namespace: torrent-mq
  labels:
    app: torrent-mq
spec:
  serviceName: torrent-mq
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: torrent-mq
  template:
    metadata:
      labels:
        app: torrent-mq
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: torrent-mq
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: torrent-mq
              topologyKey: kubernetes.io/hostname
      containers:
        - name: torrentd
          image: torrent-mq/torrentd:latest
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/torrentd
            - --config-file
            - /etc/torrent/config.yaml
          env:
            - name: BROKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SEED_SERVERS
              value: "torrent-mq-0.torrent-mq:9092,torrent-mq-1.torrent-mq:9092,torrent-mq-2.torrent-mq:9092"
            - name: SASL_ENABLED
              value: "false"
            - name: TLS_ENABLED
              value: "false"
          ports:
            - name: plain
              containerPort: 9092
              protocol: TCP
            - name: tls
              containerPort: 9093
              protocol: TCP
            - name: admin
              containerPort: 9644
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              memory: "2Gi"
              cpu: "2"
            limits:
              memory: "8Gi"
              cpu: "8"
          livenessProbe:
            httpGet:
              path: /v1/cluster/health
              port: 9644
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/cluster/health
              port: 9644
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /etc/torrent
              readOnly: true
            - name: data
              mountPath: /data/torrent
            - name: tls
              mountPath: /etc/torrent/certs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: torrent-mq-config
        - name: tls
          projected:
            sources:
              - secret:
                  name: torrent-mq-tls
                  items:
                    - key: tls.crt
                      path: tls.crt
                    - key: tls.key
                      path: tls.key
              - secret:
                  name: torrent-mq-ca
                  items:
                    - key: ca.crt
                      path: ca.crt
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Gi
        storageClassName: fast-ssd
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: torrent-mq-prometheus
  namespace: torrent-mq
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'torrent-mq'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - torrent-mq
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: torrent-mq
  namespace: torrent-mq
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: torrent-mq
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
