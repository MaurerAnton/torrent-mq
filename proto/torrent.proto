# torrent-mq gRPC Protocol Definitions

## Inter-Broker Raft Service

```protobuf
syntax = "proto3";

package torrent.raft;

// Raft consensus RPC service
service RaftService {
    // AppendEntries: replicate log entries or heartbeat
    rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);

    // RequestVote: request vote during election
    rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);

    // InstallSnapshot: stream snapshot to follower
    rpc InstallSnapshot(stream InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

message AppendEntriesRequest {
    int64 term = 1;
    int32 leader_id = 2;
    int64 prev_log_index = 3;
    int64 prev_log_term = 4;
    repeated LogEntry entries = 5;
    int64 leader_commit = 6;
}

message AppendEntriesResponse {
    int64 term = 1;
    bool success = 2;
    int64 conflict_index = 3;
    int64 conflict_term = 4;
}

message RequestVoteRequest {
    int64 term = 1;
    int32 candidate_id = 2;
    int64 last_log_index = 3;
    int64 last_log_term = 4;
    bool pre_vote = 5;
}

message RequestVoteResponse {
    int64 term = 1;
    bool vote_granted = 2;
}

message InstallSnapshotRequest {
    int64 term = 1;
    int32 leader_id = 2;
    int64 last_included_index = 3;
    int64 last_included_term = 4;
    int64 offset = 5;
    bytes data = 6;
    bool done = 7;
}

message InstallSnapshotResponse {
    int64 term = 1;
}

message LogEntry {
    int64 term = 1;
    int64 index = 2;
    oneof command {
        NoOpCommand noop = 3;
        ConfigChangeCommand config_change = 4;
        UserCommand user = 5;
    }
}

message NoOpCommand {}

message ConfigChangeCommand {
    repeated int32 old_members = 1;
    repeated int32 new_members = 2;
}

message UserCommand {
    bytes data = 1;
}
```

## Metadata Service

```protobuf
syntax = "proto3";

package torrent.metadata;

service MetadataService {
    // Register a broker with the cluster
    rpc RegisterBroker(RegisterBrokerRequest) returns (RegisterBrokerResponse);

    // Get cluster metadata
    rpc GetMetadata(GetMetadataRequest) returns (GetMetadataResponse);

    // Update partition metadata
    rpc UpdatePartitionMetadata(UpdatePartitionRequest) returns (UpdatePartitionResponse);

    // Heartbeat from broker to controller
    rpc BrokerHeartbeat(BrokerHeartbeatRequest) returns (BrokerHeartbeatResponse);
}

message RegisterBrokerRequest {
    int32 broker_id = 1;
    string host = 2;
    int32 port = 3;
    string rack = 4;
}

message RegisterBrokerResponse {
    bool success = 1;
    int32 controller_id = 2;
}

message GetMetadataRequest {
    repeated string topics = 1;  // Empty = all topics
}

message GetMetadataResponse {
    repeated BrokerMetadata brokers = 1;
    int32 controller_id = 2;
    string cluster_id = 3;
    repeated TopicMetadata topics = 4;
}

message BrokerMetadata {
    int32 node_id = 1;
    string host = 2;
    int32 port = 3;
    string rack = 4;
}

message TopicMetadata {
    string name = 1;
    repeated PartitionMetadata partitions = 2;
}

message PartitionMetadata {
    int32 partition_id = 1;
    int32 leader_id = 2;
    repeated int32 replicas = 3;
    repeated int32 isr = 4;
}

message UpdatePartitionRequest {
    string topic = 1;
    int32 partition = 2;
    int32 leader_id = 3;
    repeated int32 isr = 4;
    int64 leader_epoch = 5;
}

message UpdatePartitionResponse {
    bool success = 1;
}

message BrokerHeartbeatRequest {
    int32 broker_id = 1;
    int64 timestamp_ms = 2;
}

message BrokerHeartbeatResponse {
    bool ok = 1;
}
```

## Consumer Group Service

```protobuf
syntax = "proto3";

package torrent.groups;

service GroupCoordinatorService {
    // Find the coordinator for a consumer group
    rpc FindCoordinator(FindCoordinatorRequest) returns (FindCoordinatorResponse);

    // Join a consumer group
    rpc JoinGroup(JoinGroupRequest) returns (JoinGroupResponse);

    // Sync group assignments
    rpc SyncGroup(SyncGroupRequest) returns (SyncGroupResponse);

    // Heartbeat
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

    // Leave group
    rpc LeaveGroup(LeaveGroupRequest) returns (LeaveGroupResponse);
}

message FindCoordinatorRequest {
    string group_id = 1;
}

message FindCoordinatorResponse {
    int32 coordinator_id = 1;
    string host = 2;
    int32 port = 3;
}

message JoinGroupRequest {
    string group_id = 1;
    int32 session_timeout_ms = 2;
    int32 rebalance_timeout_ms = 3;
    string member_id = 4;
    string protocol_type = 5;
    repeated GroupProtocol protocols = 6;
}

message GroupProtocol {
    string name = 1;
    bytes metadata = 2;
}

message JoinGroupResponse {
    int32 generation_id = 1;
    string protocol_name = 2;
    string leader_id = 3;
    string member_id = 4;
    repeated Member members = 5;
}

message Member {
    string member_id = 1;
    bytes metadata = 2;
}

message SyncGroupRequest {
    string group_id = 1;
    int32 generation_id = 2;
    string member_id = 3;
    bytes assignment = 4;
}

message SyncGroupResponse {
    bytes assignment = 1;
}

message HeartbeatRequest {
    string group_id = 1;
    int32 generation_id = 2;
    string member_id = 3;
}

message HeartbeatResponse {
    int32 error_code = 1;
}

message LeaveGroupRequest {
    string group_id = 1;
    string member_id = 2;
}

message LeaveGroupResponse {
    int32 error_code = 1;
}
```
